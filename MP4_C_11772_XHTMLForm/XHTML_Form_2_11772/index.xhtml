<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type"
          content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>

</head>
<body>

    <h1>Formulir Pendaftaran Lomba</h1>

    <form method="post"
          enctype="multipart/form-data">

        <strong>Data Tim</strong>

        <br />
        <br />

        <table cellspacing="4" cellpadding="4" border="1"
            style="border-collapse:collapse; width:100%;">


            <tr>

                <td style="width:32%;">

                    <strong>Nama Tim</strong>

                </td>


                <td>

                    <input type="text"
                           name="nama_tim" />

                </td>


            </tr>

            <tr>

                <td style="width:32%;">

                    <strong>Nama Ketua</strong>

                </td>

                <td>

                    <input type="text"
                           name="nama_ketua" />

                </td>

            </tr>

            <tr>

                <td style="width:32%;">

                    <strong>Jumlah Anggota</strong>

                </td>

                <td>

                    <input type="text"
                           name="jumlah_anggota" />

                </td>

            </tr>

            <tr>

                <td style="width:32%;">

                    <strong>Program Studi</strong>

                </td>

                <td>

                    <select name="program_studi">

                        <option>
                            Informatika
                        </option>

                        <option>
                            Sistem Informasi
                        </option>

                        <option>
                            Teknik Industri
                        </option>

                    </select>

                </td>

            </tr>

        </table>

        <br />
        <br />

        <strong>Pilihan Lomba</strong>
        <br />
        <br />

        <table cellspacing="4" cellpadding="4" border="1"
            style="border-collapse:collapse; width:100%;">

            <tr>

                <td style="width:32%;">

                    <strong>Kategori Lomba</strong>
                </td>

                <td>

                    <input type="radio"
                           id="individu"
                           name="kategori"
                           value="Individu" />

                    <label for="individu">
                        Individu
                    </label>

                    <input type="radio"
                           id="kelompok"
                           name="kategori"
                           value="Kelompok" />

                    <label for="kelompok">
                        Kelompok
                    </label>

                </td>

            </tr>

            <tr>

                <td style="width:32%;">

                    <strong>Bidang Lomba</strong>

                </td>

                <td>

                    <p>
                        <input type="checkbox"
                               id="programming"
                               name="bidang"
                               value="Programming" />

                        <label for="programming">
                            Programming
                        </label>

                    </p>
                    <p>

                        <input type="checkbox"
                               id="uiux"
                               name="bidang"
                               value="UI/UX Design" />

                        <label for="uiux">
                            UI/UX Design
                        </label>

                    </p>
                    <p>

                        <input type="checkbox"
                               id="karya"
                               name="bidang"
                               value="Karya Tulis" />

                        <label for="karya">
                            Karya Tulis
                        </label>

                    </p>

                </td>
            </tr>
        </table>

        <br />
        <br />

        <strong>Informasi Karya</strong>

        <br />
        <br />

        <table cellspacing="4" cellpadding="4" border="1"
            style="border-collapse:collapse; width:100%;">

            <tr>

                <td style="width:32%;">
                    <strong>Deskripsi Karya</strong>

                </td>

                <td>
                    <textarea name="deskripsi"
                              rows="8"
                              cols="30"></textarea>

                </td>

            </tr>

            <tr>

                <td style="width:32%;">

                    <strong>File Karya</strong>

                </td>

                <td>

                    <input type="file"
                           name="file_karya" />


                </td>

            </tr>

            <tr>

                <td colspan="2"
                    style="text-align:center;">

                    <input type="submit"
                           name="daftar"
                           value="Daftar" />

                </td>
            </tr>
        </table>
    </form>
</body>
</html>
